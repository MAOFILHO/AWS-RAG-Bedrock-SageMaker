[project]
name = "rag-course"
version = "0.1.0"
description = "RAG over web pages, a PDF and a SQL database with AWS Bedrock."
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "boto3>=1.43.125",
    "langchain-text-splitters>=1.1.3",
    "numpy>=2.5.4",
    "requests>=2.34.2",
    "typer>=0.12",
]

[project.scripts]
rag = "rag_course.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_course"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls real Bedrock models; run by hand with -m live"]
