[project]
name = "rag-course"
version = "0.1.0"
description = "RAG over web pages, a PDF and a SQL database with AWS Bedrock."
requires-python = ">=3.12,<3.13"
dependencies = ["typer>=0.12"]

[project.scripts]
rag = "rag_course.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_course"]

[tool.pytest.ini_options]
testpaths = ["tests"]
